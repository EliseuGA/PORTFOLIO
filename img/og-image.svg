<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Fundo com gradiente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="60%" style="stop-color:#060606"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>

    <!-- Glow ciano -->
    <radialGradient id="glowCyan" cx="30%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:.08"/>
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
    </radialGradient>

    <!-- Glow vermelho -->
    <radialGradient id="glowRed" cx="80%" cy="60%" r="45%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:.06"/>
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0"/>
    </radialGradient>

    <!-- Clip -->
    <clipPath id="bounds">
      <rect width="1200" height="630"/>
    </clipPath>

    <!-- Filtro de blur para glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#bounds)">
    <!-- Fundo -->
    <rect width="1200" height="630" fill="url(#bgGrad)"/>
    <rect width="1200" height="630" fill="url(#glowCyan)"/>
    <rect width="1200" height="630" fill="url(#glowRed)"/>

    <!-- Grid de linhas sutis -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="105" x2="1200" y2="105"/>
      <line x1="0" y1="210" x2="1200" y2="210"/>
      <line x1="0" y1="315" x2="1200" y2="315"/>
      <line x1="0" y1="420" x2="1200" y2="420"/>
      <line x1="0" y1="525" x2="1200" y2="525"/>
      <line x1="200" y1="0" x2="200" y2="630"/>
      <line x1="400" y1="0" x2="400" y2="630"/>
      <line x1="600" y1="0" x2="600" y2="630"/>
      <line x1="800" y1="0" x2="800" y2="630"/>
      <line x1="1000" y1="0" x2="1000" y2="630"/>
    </g>

    <!-- Texto decorativo CM enorme no fundo -->
    <text x="580" y="520" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="480" fill="none" stroke="#111111" stroke-width="1" opacity="0.5" letter-spacing="-30">CM</text>

    <!-- Barra colorida topo -->
    <rect x="0" y="0" width="1200" height="4" fill="#00e5ff"/>

    <!-- Faixa ciano lateral esquerda -->
    <rect x="60" y="80" width="4" height="470" fill="#00e5ff" opacity="0.6"/>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->

    <!-- Logo / tag -->
    <text x="92" y="138" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#00e5ff" letter-spacing="4" text-transform="uppercase">// EDITOR DE VÍDEO &amp; MOTION DESIGNER</text>

    <!-- Nome principal - linha 1 -->
    <text x="88" y="252" font-family="Inter, Arial Black, sans-serif" font-size="110" font-weight="900" fill="#ffffff" letter-spacing="-4">CADEIRANTE</text>

    <!-- Nome principal - linha 2 (itálico + ciano) -->
    <text x="88" y="372" font-family="Inter, Arial Black, sans-serif" font-size="110" font-weight="900" fill="#00e5ff" letter-spacing="-4" font-style="italic" filter="url(#softglow)">MAROMBA</text>

    <!-- Tagline -->
    <text x="92" y="440" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#666666" letter-spacing="1">Transformo arquivos em</text>
    <text x="92" y="472" font-family="Inter, Arial Black, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">HISTÓRIA.</text>

    <!-- ===== STATS ===== -->
    <!-- Divisor -->
    <rect x="92" y="510" width="500" height="1" fill="#1a1a1a"/>

    <!-- Stats -->
    <text x="92" y="548" font-family="Inter, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#00e5ff">50+</text>
    <text x="92" y="568" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#555555" letter-spacing="2">PARCERIAS</text>

    <text x="230" y="548" font-family="Inter, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#fffc00">1M+</text>
    <text x="230" y="568" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#555555" letter-spacing="2">VIEWS</text>

    <text x="358" y="548" font-family="Inter, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#ffffff">100%</text>
    <text x="358" y="568" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#555555" letter-spacing="2">DEDICAÇÃO</text>

    <!-- ===== LADO DIREITO — Card de destaque ===== -->

    <!-- Card principal -->
    <rect x="800" y="80" width="340" height="470" rx="12" fill="#080808" stroke="#1e1e1e" stroke-width="1"/>
    <!-- Borda ciano no topo do card -->
    <rect x="800" y="80" width="340" height="3" rx="0" fill="#00e5ff"/>

    <!-- Ícone de play -->
    <circle cx="970" cy="230" r="52" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
    <circle cx="970" cy="230" r="52" fill="#0d0d0d"/>
    <polygon points="958,210 1000,230 958,250" fill="#ff0000"/>

    <!-- Texto dentro do card -->
    <text x="970" y="318" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#555555" letter-spacing="2" text-anchor="middle">MOTION · LONGOS · SHORTS</text>

    <!-- Divisor card -->
    <rect x="840" y="345" width="260" height="1" fill="#141414"/>

    <!-- Serviços no card -->
    <text x="840" y="382" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333">—</text>
    <text x="860" y="382" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#888888">Edição de Vídeo</text>

    <text x="840" y="410" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333">—</text>
    <text x="860" y="410" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#888888">Motion Graphics</text>

    <text x="840" y="438" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333">—</text>
    <text x="860" y="438" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#888888">Thumbnails &amp; Artes</text>

    <text x="840" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333">—</text>
    <text x="860" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#888888">Sprites PNGTuber</text>

    <!-- CTA no card -->
    <rect x="840" y="496" width="260" height="40" rx="4" fill="#ff0000"/>
    <text x="970" y="521" font-family="Inter, Arial Black, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VER PORTFÓLIO →</text>

    <!-- URL / domínio no rodapé -->
    <text x="92" y="610" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" letter-spacing="1">cadeirantemaromba.vercel.app</text>

  </g>
</svg>
